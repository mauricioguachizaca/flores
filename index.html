<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carta de flores amarillas</title>
    <style>
      :root {
        --bg-1: #fff5b8;
        --bg-2: #ffd75b;
        --gold-1: #f9d84b;
        --gold-2: #e7a400;
        --gold-3: #c97a00;
        --paper: rgba(255,255,255,0.78);
        --brown: #5a3a12;
        --brown-soft: #7b542a;
        --envelope-1: #f8d76e;
        --envelope-2: #f0b62a;
        --envelope-3: #d68d00;
        --shadow: rgba(123, 78, 10, 0.2);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Georgia, "Times New Roman", serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: radial-gradient(circle at top, #fffef4 0%, var(--bg-1) 24%, var(--bg-2) 100%);
        color: var(--brown);
        padding: 32px 16px 50px;
      }

      .page {
        width: min(92vw, 980px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        margin-top: 20px;
      }

      .envelope-wrapper {
        position: relative;
        width: min(92vw, 720px);
        display: flex;
        justify-content: center;
        margin-top: 80px;
        transition: opacity 0.5s ease, transform 0.5s ease, height 0.5s ease, margin 0.5s ease;
      }

      .page.open .envelope-wrapper {
        opacity: 0;
        transform: translateY(-40px);
        height: 0;
        margin-top: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .envelope-button {
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .envelope {
        position: relative;
        width: min(90vw, 640px);
        height: 430px;
        border-radius: 26px;
        background: linear-gradient(180deg, var(--envelope-1), var(--envelope-2));
        border: 4px solid rgba(164, 101, 0, 0.42);
        box-shadow: 0 28px 50px var(--shadow);
        overflow: hidden;
        transition: transform 0.7s ease, box-shadow 0.7s ease;
      }

      .envelope-button.open .envelope {
        transform: translateY(-8px) scale(1.01);
        box-shadow: 0 34px 62px rgba(123, 78, 10, 0.24);
      }

      .envelope::before,
      .envelope::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .envelope::before {
        background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 55%);
      }

      .envelope::after {
        background: linear-gradient(135deg, transparent 0 49.5%, rgba(122, 77, 10, 0.28) 49.5% 50.5%, transparent 50.5% 100%);
      }

      .flap {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--envelope-2), var(--envelope-3));
        clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 0, 0 0);
        transform-origin: top center;
        transition: transform 0.9s ease;
        z-index: 2;
      }

      .envelope-button.open .flap {
        transform: rotateX(180deg);
      }

      .letter {
        position: absolute;
        left: 50%;
        top: 46px;
        width: min(84%, 520px);
        height: 310px;
        transform: translateX(-50%) translateY(20px);
        background: rgba(255,255,255,0.9);
        border: 3px solid rgba(174, 111, 18, 0.35);
        border-radius: 18px;
        box-shadow: 0 18px 32px rgba(131, 86, 16, 0.12);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.5s ease, transform 0.8s ease;
        z-index: 1;
      }

      .envelope-button.open .letter {
        opacity: 1;
        transform: translateX(-50%) translateY(0px);
      }

      .letter-inner {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,245,198,0.9));
      }

      .letter-inner img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 14px;
        border: 2px solid rgba(169, 109, 16, 0.3);
      }

      .letter-inner h2 {
        margin: 12px 0 8px;
        color: var(--gold-3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: clamp(1.5rem, 2vw, 2.1rem);
      }

      .letter-inner p {
        margin: 0;
        line-height: 1.7;
        font-size: 1.05rem;
        color: var(--brown);
      }

      .click-tag {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255,255,255,0.7);
        color: var(--gold-3);
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.84rem;
        z-index: 3;
      }

      .carousel-wrap {
        width: min(94vw, 1100px);
        background: rgba(255,255,255,0.64);
        border: 2px solid rgba(169, 109, 16, 0.38);
        border-radius: 24px;
        padding: 22px 18px 16px;
        box-shadow: 0 15px 30px rgba(123, 78, 10, 0.08);
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 0.5s ease, transform 0.5s ease;
        visibility: hidden;
      }

      .page.open .carousel-wrap {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
        animation: fadeUp 0.7s ease forwards;
      }

      .page.open .envelope-button {
        pointer-events: none;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .carousel-wrap h3 {
        margin: 0 0 18px;
        text-align: center;
        color: var(--gold-3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 1rem;
      }

      .carousel {
        display: grid;
        grid-template-columns: 46px 1fr 46px;
        gap: 12px;
        align-items: center;
      }

      .nav-btn {
        border: none;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(145deg, var(--gold-1), var(--gold-2));
        color: white;
        font-size: 2rem;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(169, 109, 16, 0.18);
      }

      .slider {
        overflow: hidden;
        border-radius: 18px;
      }

      .slides {
        display: flex;
        transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .slide {
        min-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 6px 0;
        text-align: center;
        animation: slideIn 0.7s ease;
      }

      .slide img {
        display: block;
        width: auto;
        max-width: 100%;
        height: min(60vh, 500px);
        max-height: 500px;
        object-fit: contain;
        border-radius: 18px;
        border: 2px solid rgba(169, 109, 16, 0.4);
        box-shadow: 0 12px 28px rgba(120, 77, 16, 0.14);
        background: rgba(255,255,255,0.2);
        animation: imageFade 0.8s ease;
      }

      .phrase {
        margin: 0;
        text-align: center;
        font-size: clamp(1.02rem, 2vw, 1.25rem);
        line-height: 1.7;
        color: var(--brown);
        min-height: 60px;
        opacity: 0;
        transform: translateY(10px);
        animation: textRise 0.6s ease forwards;
        animation-delay: 0.15s;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes imageFade {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes textRise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .dots {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(201, 122, 0, 0.22);
        border: none;
        padding: 0;
        cursor: pointer;
      }

      .dot.active {
        background: var(--gold-2);
        box-shadow: 0 0 0 4px rgba(247, 216, 75, 0.18);
      }

      .final-message {
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        gap: 12px;
        min-height: 420px;
        padding: 20px;
        animation: finalFade 0.8s ease;
      }

      .final-message.show {
        display: flex;
      }

      .heart {
        font-size: clamp(4rem, 8vw, 7rem);
        color: #f3c41f;
        text-shadow: 0 0 18px rgba(243, 196, 31, 0.5);
        animation: heartBeat 1.2s ease-in-out infinite;
      }

      .final-message p {
        margin: 0;
        font-size: clamp(1.2rem, 2.2vw, 2rem);
        color: var(--brown);
        line-height: 1.6;
      }

      @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        20% { transform: scale(1.12); }
        40% { transform: scale(0.96); }
        60% { transform: scale(1.08); }
      }

      @keyframes finalFade {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 640px) {
        .page {
          margin-top: 10px;
        }

        .envelope {
          height: 360px;
        }

        .letter {
          height: 250px;
          top: 38px;
        }

        .letter-inner img {
          height: 140px;
        }

        .slide img {
          height: min(42vh, 290px);
        }

        .carousel {
          grid-template-columns: 1fr;
        }

        .nav-btn {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="envelope-wrapper">
        <button class="envelope-button" id="letterToggle" aria-label="Abrir sobre">
          <div class="envelope" aria-hidden="true">
            <div class="flap"></div>
            <div class="letter">
              <div class="letter-inner">
                <img src="flor_carta.png" alt="Carta floral" />
                <h2>Flores amarillas</h2>
                <p>Hoy te envío color, alegría y un cariño que florece cada día.</p>
              </div>
            </div>
            <div class="click-tag">Haz clic</div>
          </div>
        </button>
      </div>

      <section class="carousel-wrap" aria-label="Carrusel con frases y flores">
        <h3>Detalles para ti</h3>

        <div class="carousel">
          <button class="nav-btn" id="prevBtn" aria-label="Anterior">&#8249;</button>

          <div class="slider">
            <div class="slides" id="slides"></div>
          </div>

          <button class="nav-btn" id="nextBtn" aria-label="Siguiente">&#8250;</button>
        </div>

        <div class="dots" id="dots" aria-label="Indicadores del carrusel"></div>

        <div class="final-message" id="finalMessage" aria-live="polite">
          <div class="heart" aria-hidden="true">❤</div>
          <p>Te amo, Odalis</p>
        </div>
      </section>
    </div>

    <audio id="music" src="Floricienta — Flores Amarillas [Letra].mp3" preload="auto"></audio>

    <script>
      const slidesData = [
        { image: 'flor_carta.png', text: 'Tú eres la flor más hermosa que ilumina mi mundo.' },
        { image: 'flores_carusel.jfif', text: 'Sé como un girasol: aunque el día se vuelva oscuro, siempre encuentra la manera de brillar.' },
        { image: 'flores_carusel.jpg', text: 'Flores amarillas para la persona que ilumina mi vida con su alegría y su cariño.' },
        { image: 'flores_carusel2.jfif', text: 'Que cada pétalo amarillo represente un deseo de felicidad, amor, paz y éxito para ti.' },
        { image: 'flores_carusel3.jfif', text: 'Y aunque no pueda entregarte esto en persona, quiero que sepas que te quiero mucho y que esta fecha siempre será especial para mí.' }
      ];

      const slidesContainer = document.getElementById('slides');
      const dotsContainer = document.getElementById('dots');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const letterToggle = document.getElementById('letterToggle');
      const music = document.getElementById('music');
      const finalMessage = document.getElementById('finalMessage');

      let currentIndex = 0;

      slidesData.forEach((slide, index) => {
        const slideElement = document.createElement('div');
        slideElement.className = 'slide';
        slideElement.innerHTML = `
          <img src="${slide.image}" alt="Flor amarilla ${index + 1}" />
          <p class="phrase">${slide.text}</p>
        `;
        slidesContainer.appendChild(slideElement);

        const dot = document.createElement('button');
        dot.className = 'dot' + (index === 0 ? ' active' : '');
        dot.type = 'button';
        dot.setAttribute('aria-label', `Ir a la frase ${index + 1}`);
        dot.addEventListener('click', () => showSlide(index));
        dotsContainer.appendChild(dot);
      });

      function showSlide(index) {
        currentIndex = (index + slidesData.length) % slidesData.length;
        slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;

        Array.from(dotsContainer.children).forEach((dot, dotIndex) => {
          dot.classList.toggle('active', dotIndex === currentIndex);
        });

        const isLastSlide = currentIndex === slidesData.length - 1;
        finalMessage.classList.toggle('show', isLastSlide);
        if (isLastSlide) {
          slidesContainer.style.display = 'none';
          prevBtn.style.display = 'none';
          nextBtn.style.display = 'none';
          dotsContainer.style.display = 'none';
        } else {
          slidesContainer.style.display = 'flex';
          prevBtn.style.display = 'block';
          nextBtn.style.display = 'block';
          dotsContainer.style.display = 'flex';
        }
      }

      prevBtn.addEventListener('click', () => showSlide(currentIndex - 1));
      nextBtn.addEventListener('click', () => showSlide(currentIndex + 1));

      const page = document.querySelector('.page');

      letterToggle.addEventListener('click', () => {
        if (!page.classList.contains('open')) {
          page.classList.add('open');
          letterToggle.classList.add('open');
          if (music.paused) {
            music.play().catch(() => {});
          }
        }
      });

      showSlide(0);
    </script>
  </body>
</html>
